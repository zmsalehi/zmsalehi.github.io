<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>پنل مدیریت مسائل | آبان</title>
<style>
:root{--navy:#022046;--cyan:#0799b8;--gold:#d1aa68;--bg:#f6fafc;--text:#09233f;--border:#dce8ef}
*{box-sizing:border-box}body{font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);margin:0;line-height:1.8}header{background:var(--navy);color:white;padding:20px max(16px,5vw)}header h1{margin:0;font-size:22px}main{max-width:1150px;margin:32px auto;padding:0 16px}.panel{background:white;border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:20px;box-shadow:0 8px 24px #0220460b}label{display:block;margin:12px 0 5px;font-weight:bold;font-size:14px}input,select,textarea{font:inherit;padding:10px;border:1px solid #cad9e4;border-radius:9px;width:100%;background:white}textarea{min-height:110px}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.controls input{flex:1;min-width:210px}button{font:inherit;cursor:pointer;border:0;border-radius:9px;padding:10px 18px;background:var(--cyan);color:white}button.secondary{background:var(--navy)}button:disabled{opacity:.6;cursor:not-allowed}.hidden{display:none!important}.muted{color:#617287;font-size:13px}.error{color:#a2293a}.success{color:#17613d}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:700px}th,td{text-align:right;padding:12px 8px;border-bottom:1px solid var(--border);vertical-align:top}th{background:#ecf5f8;font-size:13px}td{font-size:14px}.details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.details>div{border-bottom:1px solid var(--border);padding:8px 0;overflow-wrap:anywhere}.details b{display:block;color:var(--navy)}.wide{grid-column:1/-1;white-space:pre-wrap}#logout{background:transparent;border:1px solid #ffffff75}.headrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}a{color:inherit}@media(max-width:600px){.details{grid-template-columns:1fr}.panel{padding:17px}}
</style>
</head>
<body>
<header><div class="headrow"><h1>آبان | پنل مدیریت مسائل</h1><button id="logout" class="hidden" type="button">خروج</button></div></header>
<main>
<section class="panel" id="loginPanel">
<h2>ورود مدیر</h2>
<p class="muted">فقط حساب‌های مدیری که در پایگاه داده مجاز شده‌اند می‌توانند درخواست‌ها را ببینند.</p>
<form id="loginForm">
<label for="email">ایمیل مدیر</label><input id="email" type="email" required autocomplete="username">
<label for="password">رمز عبور</label><input id="password" type="password" required autocomplete="current-password">
<p><button type="submit" id="loginBtn">ورود</button></p>
</form>
<p id="loginMessage" role="status"></p>
</section>
<section class="hidden" id="dashboard">
<div class="panel"><div class="headrow"><div><h2>درخواست‌های ثبت‌شده</h2><p class="muted" id="count"></p></div><div class="controls"><button class="secondary" id="reload">به‌روزرسانی</button><button id="export">خروجی CSV</button></div></div>
<label for="search">جست‌وجو</label><input id="search" placeholder="عنوان مسئله، سازمان یا نام رابط...">
<p role="status" id="loadMessage"></p><div class="tablewrap"><table><thead><tr><th>تاریخ</th><th>عنوان مسئله</th><th>سازمان</th><th>وضعیت</th><th>جزئیات</th></tr></thead><tbody id="rows"></tbody></table></div></div>
<div class="panel hidden" id="detailPanel"><h2>جزئیات درخواست</h2><div id="details" class="details"></div>
<label for="status">وضعیت بررسی</label><select id="status"><option value="new">جدید</option><option value="reviewing">در حال بررسی</option><option value="more_info">نیازمند اطلاعات بیشتر</option><option value="matched">آماده معرفی راهکار</option><option value="closed">بسته‌شده</option></select>
<label for="notes">یادداشت داخلی آبان</label><textarea id="notes" maxlength="10000"></textarea>
<p><button type="button" id="save">ذخیره تغییرات</button></p><p id="saveMessage" role="status"></p></div>
</section>
</main>
<script>
// فقط اطلاعات عمومی پروژه را وارد کنید. Secret Key و Service Role هرگز اینجا نباشند.
const SUPABASE_URL = 'https://yxmrflrqzpstmafkonnr.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_Fu7LRMCSJ85k7_FECupFhg_FQFqdaF8';
const $ = id => document.getElementById(id);
const fields = ['id','created_at','organization','contact_name','role','email','phone','title','domain','stage','description','desired_outcome','timeline','budget','constraints','review_status','internal_notes'];
const labels = {organization:'سازمان',contact_name:'فرد رابط',role:'سمت',email:'ایمیل',phone:'شماره تماس',title:'عنوان مسئله',domain:'حوزه',stage:'وضعیت فعلی',description:'شرح مسئله',desired_outcome:'نتیجه مورد انتظار',timeline:'زمان‌بندی',budget:'بودجه',constraints:'محدودیت‌ها',created_at:'زمان ثبت'};
const statuses = {new:'جدید',reviewing:'در حال بررسی',more_info:'نیازمند اطلاعات بیشتر',matched:'آماده معرفی راهکار',closed:'بسته‌شده'};
let token = null, records = [], selected = null;
const apiBase = SUPABASE_URL.replace(/\/$/,'');
function display(el,text,type=''){el.textContent=text;el.className=type;}
async function request(path,method='GET',body=null){
  const response=await fetch(apiBase+path,{method,headers:{'apikey':SUPABASE_PUBLISHABLE_KEY,...(token?{'Authorization':'Bearer '+token}:{}),...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{})});
  const txt=await response.text();let data;try{data=txt?JSON.parse(txt):null}catch{data=null}
  if(!response.ok){throw new Error(data?.message||data?.msg||data?.error_description||'خطای ارتباط با سرور ('+response.status+')')}
  return data;
}
$('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();const btn=$('loginBtn');btn.disabled=true;display($('loginMessage'),'در حال بررسی اطلاعات ورود...');
  try{
    const result=await fetch(apiBase+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':SUPABASE_PUBLISHABLE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});
    const data=await result.json();if(!result.ok||!data.access_token)throw new Error(data.msg||data.error_description||'ورود ناموفق بود');
    token=data.access_token;$('password').value='';await load();
    $('loginPanel').classList.add('hidden');$('dashboard').classList.remove('hidden');$('logout').classList.remove('hidden');
  }catch(err){token=null;display($('loginMessage'),'خطا: '+err.message,'error')}
  finally{btn.disabled=false}
});
$('logout').addEventListener('click',()=>{token=null;records=[];selected=null;$('dashboard').classList.add('hidden');$('detailPanel').classList.add('hidden');$('logout').classList.add('hidden');$('loginPanel').classList.remove('hidden');display($('loginMessage'),'خارج شدید.','success')});
async function load(){
  display($('loadMessage'),'در حال دریافت اطلاعات...');
  records=await request('/rest/v1/problem_submissions?select='+encodeURIComponent(fields.join(','))+'&order=created_at.desc&limit=1000');
  render();display($('loadMessage'),'');
}
function render(){
  const q=$('search').value.trim().toLocaleLowerCase('fa');
  const filtered=records.filter(r=>[r.title,r.organization,r.contact_name].some(v=>String(v||'').toLocaleLowerCase('fa').includes(q)));
  $('count').textContent=`${filtered.length} درخواست نمایش داده می‌شود (حداکثر ۱۰۰۰ مورد آخر)`;
  const tbody=$('rows');tbody.replaceChildren();
  filtered.forEach(r=>{
    const tr=document.createElement('tr');
    [new Date(r.created_at).toLocaleDateString('fa-IR'),r.title,r.organization,statuses[r.review_status]||r.review_status].forEach(v=>{const td=document.createElement('td');td.textContent=v||'—';tr.appendChild(td)});
    const td=document.createElement('td'),button=document.createElement('button');button.textContent='مشاهده';button.type='button';button.addEventListener('click',()=>showDetail(r.id));td.appendChild(button);tr.appendChild(td);tbody.appendChild(tr);
  });
}
function showDetail(id){
  selected=records.find(r=>r.id===id);if(!selected)return;
  const container=$('details');container.replaceChildren();
  Object.entries(labels).forEach(([key,label])=>{const div=document.createElement('div');if(['description','desired_outcome','constraints'].includes(key))div.className='wide';const b=document.createElement('b');b.textContent=label;const span=document.createElement('span');span.textContent=key==='created_at'?new Date(selected[key]).toLocaleString('fa-IR'):String(selected[key]||'—');div.append(b,span);container.appendChild(div)});
  $('status').value=statuses[selected.review_status]?selected.review_status:'new';$('notes').value=selected.internal_notes||'';display($('saveMessage'),'');$('detailPanel').classList.remove('hidden');$('detailPanel').scrollIntoView({behavior:'smooth'});
}
$('save').addEventListener('click',async()=>{
  if(!selected)return;const btn=$('save');btn.disabled=true;
  try{
    await request('/rest/v1/problem_submissions?id=eq.'+encodeURIComponent(selected.id),'PATCH',{review_status:$('status').value,internal_notes:$('notes').value});
    display($('saveMessage'),'تغییرات ذخیره شدند.','success');await load();showDetail(selected.id);
  }catch(err){display($('saveMessage'),'خطا: '+err.message,'error')}
  finally{btn.disabled=false}
});
$('search').addEventListener('input',render);
$('reload').addEventListener('click',async()=>{try{await load()}catch(err){display($('loadMessage'),err.message,'error')}});
function csvValue(v){return '"'+String(v??'').replace(/^\s*[=+@\-]/, "'$&").replace(/"/g,'""')+'"'}
$('export').addEventListener('click',()=>{
  const csv='\uFEFF'+fields.join(',')+'\r\n'+records.map(r=>fields.map(key=>csvValue(r[key])).join(',')).join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='aban-problems.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
});
</script>
</body>
</html>
