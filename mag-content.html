<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محتوا | آبان MAG</title><link rel="stylesheet" href="mag.css"><style>main{max-width:1000px!important;margin:36px auto;padding:0 18px}.paper{background:white;border-radius:19px;padding:clamp(18px,5vw,50px);box-shadow:0 10px 38px #09234010}.cover{width:100%;max-height:480px;object-fit:cover;border-radius:16px}.reading{max-width:760px;margin:auto;font-size:18px;line-height:2.35;white-space:normal}.reading p{margin:1.4em 0}.reading h2{margin-top:1.7em}.reading img{max-width:100%;height:auto;border-radius:12px}.meta{margin:14px 0 28px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:28px 0}.actions a{padding:10px 16px;background:#022046;color:white;text-decoration:none;border-radius:8px}.player{margin:22px 0}.player iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px}.player audio{width:100%}.recommend a{display:block;margin:8px 0}.error{padding:25px;background:#fff5f2;border-radius:12px}</style></head><body><header class="header"><div class="wrap"><a class="brand" href="mag.html">آبان <span>MAG.</span></a><nav><a href="mag.html">بازگشت به مجله</a></nav></div></header><main><article class="paper" id="paper"><p>در حال دریافت محتوا...</p></article></main><script>
const ROOT='https://yxmrflrqzpstmafkonnr.supabase.co',KEY='sb_publishable_Fu7LRMCSJ85k7_FECupFhg_FQFqdaF8';const paper=document.getElementById('paper');function el(tag,txt,cls){const e=document.createElement(tag);if(txt!==undefined)e.textContent=txt;if(cls)e.className=cls;return e}function link(href,txt){const a=el('a',txt);a.href=href;return a}function addMarkdown(root,text){const lines=(text||'').split(/\r?\n/);let para=[],list=null;function flush(){if(para.length){root.append(el('p',para.join(' ')));para=[]}list=null}for(const line of lines){const s=line.trim();if(!s){flush();continue}if(/^#{1,4}\s/.test(s)){flush();const n=s.match(/^#+/)[0].length;root.append(el('h'+Math.max(2,Math.min(4,n)),s.replace(/^#{1,4}\s+/,'')));continue}if(/^[-*]\s+/.test(s)){if(para.length)flush();if(!list){list=el('ul');root.append(list)}list.append(el('li',s.replace(/^[-*]\s+/,'')));continue}if(/^!\[[^\]]*\]\((https:\/\/[^)]+)\)$/.test(s)){flush();const matches=s.match(/^!\[([^\]]*)\]\((https:\/\/[^)]+)\)$/);const img=el('img');img.alt=matches[1];img.src=matches[2];img.loading='lazy';root.append(img);continue}if(list)list=null;para.push(s)}flush()}
function aparatEmbed(u){try{const url=new URL(u);if(!['aparat.com','www.aparat.com'].includes(url.hostname))return null;const found=url.pathname.match(/^\/(?:v|video)\/([a-zA-Z0-9_-]+)\/?$/);return found?'https://www.aparat.com/video/video/embed/videohash/'+encodeURIComponent(found[1])+'/vt/frame':null}catch{return null}}
async function load(){const slug=new URLSearchParams(location.search).get('slug');if(!slug||!/^[a-z0-9]+(-[a-z0-9]+)*$/.test(slug)){paper.textContent='شناسه محتوا نامعتبر است.';return}try{const r=await fetch(ROOT+'/rest/v1/aban_mag_content?select=*&slug=eq.'+encodeURIComponent(slug)+'&is_published=eq.true&limit=1',{headers:{apikey:KEY}});if(!r.ok)throw Error('دسترسی به مجله برقرار نشد');const [c]=await r.json();if(!c){paper.textContent='این مطلب هنوز منتشر نشده یا وجود ندارد.';return}paper.replaceChildren();document.title=c.title+' | آبان MAG';const category=el('div',(c.kind==='article'?'مقاله':c.kind==='podcast'?'پادکست':'ویدئو')+' · '+(c.category||'آبان MAG'),'eyebrow');const h=el('h1',c.title);const meta=el('p',(c.author||'تحریریه آبان')+(c.duration_minutes?' · '+c.duration_minutes+' دقیقه':''),'meta');const cover=el('img');cover.src=c.cover_url;cover.alt='تصویر شاخص '+c.title;cover.className='cover';const summary=el('p',c.summary,'lead');paper.append(category,h,meta,cover,summary);if(c.kind==='video'){const embed=aparatEmbed(c.media_url);if(embed){const player=el('div',undefined,'player');const frame=el('iframe');frame.src=embed;frame.title=c.title;frame.loading='lazy';frame.allowFullscreen=true;frame.referrerPolicy='strict-origin-when-cross-origin';player.append(frame);paper.append(player)}else paper.append(el('p','لینک آپارات معتبر نیست.'))}if(c.kind==='podcast'){const player=el('div',undefined,'player');const audio=el('audio');audio.controls=true;audio.preload='none';audio.src=c.media_url;player.append(audio);paper.append(player)}if(c.kind==='article'){const body=el('div',undefined,'reading');addMarkdown(body,c.body_markdown);paper.append(body)}if(c.sources){const src=el('section',undefined,'reading');src.append(el('h2','منابع و پیوندها'));addMarkdown(src,c.sources);paper.append(src)}const actions=el('div',undefined,'actions');if(c.cta_problem)actions.append(link('problem.html','ثبت مسئله سازمانی'));if(c.cta_capability)actions.append(link('https://forms.gle/mDLAuRdTJF8zM4P5A','معرفی توانمندی'));if(c.extra_url&&/^https:\/\//.test(c.extra_url))actions.append(link(c.extra_url,'پیوند تکمیلی'));if(actions.childNodes.length)paper.append(actions);if(c.related_slugs?.length){const rel=el('section',undefined,'recommend');rel.append(el('h2','مطالب مرتبط'));for(const s of c.related_slugs){if(/^[a-z0-9]+(-[a-z0-9]+)*$/.test(s))rel.append(link('mag-content.html?slug='+encodeURIComponent(s),s))}paper.append(rel)}}catch(e){paper.replaceChildren(el('p','بارگذاری محتوا ناموفق بود. کمی بعد دوباره تلاش کنید.','error'))}}load();
</script></body></html>
