<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ارسال محتوا | آبان MAG</title><link rel="stylesheet" href="mag.css"><style>main{max-width:820px!important;margin:35px auto;padding:0 18px}.sheet{background:#fff;border:1px solid #d9e6ee;border-radius:20px;padding:30px;box-shadow:0 10px 32px #04213b0b}label{display:block;margin:14px 0;font-weight:600}input,select,textarea{width:100%;display:block;margin-top:6px;padding:12px;border:1px solid #bdced8;border-radius:9px;font:inherit}textarea{min-height:120px}.hint{color:#63778a;font-size:13px}.sheet button{padding:12px 24px;background:#022046;color:white;border:0;border-radius:10px;cursor:pointer}.sheet button:disabled{opacity:.5}</style></head><body><header class="header"><div class="wrap"><a class="brand" href="mag.html">آبان <span>MAG.</span></a><nav><a href="mag.html">بازگشت به مجله</a></nav></div></header><main><div class="sheet"><h1>ارسال محتوا برای آبان MAG</h1><p>مقاله، پادکست و ویدئوی تخصصی خود را برای بررسی تحریریه ارسال کنید. ارسال مطلب به معنی تأیید انتشار نیست.</p><form id="form"><label>عنوان محتوا *<input name="title" maxlength="220" required minlength="3"></label><label>نوع محتوا *<select name="kind"><option value="article">مقاله</option><option value="podcast">پادکست</option><option value="video">ویدئو (آپارات)</option></select></label><label>نام نویسنده یا تولیدکننده *<input name="author_name" maxlength="150" required></label><label>ایمیل تماس *<input name="email" type="email" maxlength="200" required></label><label>حوزه / دسته‌بندی<input name="category" maxlength="120"></label><label>معرفی و خلاصه محتوا *<textarea name="summary" maxlength="1500" minlength="10" required></textarea></label><label>متن مقاله (در صورت انتخاب مقاله الزامی)<textarea name="body_markdown" maxlength="50000" placeholder="متن کامل مقاله را اینجا وارد کنید. برای عنوان بخش‌ها از ## استفاده کنید."></textarea></label><label>لینک پادکست / ویدئوی آپارات<input name="media_url" maxlength="1000" placeholder="https://www.aparat.com/v/..."></label><label>نشانی تصویر شاخص (اختیاری هنگام ارسال)<input name="cover_url" maxlength="1000" placeholder="https://..."></label><p class="hint">اطلاعات و محتوای ارسالی عمومی نمایش داده نمی‌شود و فقط در اختیار تحریریه است. از ارسال اطلاعات محرمانه یا مطالب بدون مجوز نشر خودداری کنید.</p><button id="send">ارسال برای بررسی</button><p id="result" role="status"></p></form></div></main><script>
const URL_BASE='https://yxmrflrqzpstmafkonnr.supabase.co',KEY='sb_publishable_Fu7LRMCSJ85k7_FECupFhg_FQFqdaF8';document.getElementById('form').onsubmit=async e=>{e.preventDefault();const f=e.target,data={};for(const name of ['title','kind','author_name','email','category','summary','body_markdown','media_url','cover_url'])data[name]=f.elements.namedItem(name).value.trim();const msg=document.getElementById('result');if(data.kind==='article'&&!data.body_markdown){msg.textContent='لطفاً متن کامل مقاله را وارد کنید.';return}if(data.kind!=='article'&&!data.media_url){msg.textContent='لطفاً لینک محتوای صوتی یا تصویری را وارد کنید.';return}if(data.kind==='video'&&!/^https:\/\/(www\.)?aparat\.com\/(v\/|video\/)/i.test(data.media_url)){msg.textContent='لطفاً لینک ویدئو را از آپارات وارد کنید.';return}const btn=document.getElementById('send');btn.disabled=true;msg.textContent='در حال ارسال...';try{const r=await fetch(URL_BASE+'/rest/v1/aban_mag_submissions',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok){let x=await r.json();throw Error(x.message||'ارسال ناموفق بود.')}f.reset();msg.textContent='مطلب شما دریافت شد و در صف بررسی تحریریه قرار گرفت.'}catch(err){msg.textContent='خطا در ارسال: '+err.message}finally{btn.disabled=false}};
</script></body></html>
