    // Publishable Key عمومی است؛ مجوز دسترسی واقعی باید در Supabase RLS کنترل شود.
    const SUPABASE_URL = 'https://yxmrflrqzpstmafkonnr.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_Fu7LRMCSJ85k7_FECupFhg_FQFqdaF8';

    const searchInput = document.getElementById('searchInput');
    const grid = document.getElementById('companyGrid');
    const filters = [...document.querySelectorAll('.filter')];
    const emptyMessage = document.getElementById('emptyMessage');
    const networkStatus = document.getElementById('networkStatus');
    const companyCount = document.getElementById('companyCount');
    const sectorCount = document.getElementById('sectorCount');

    let activeFilter = 'all';
    let companies = [];

    function createCard(company) {
      const name = String(company.name || 'شرکت بدون نام');
      const href = 'company.html?slug=' + encodeURIComponent(company.slug || '');

      const card = document.createElement('article');
      card.className = 'card company-network-card';
      card.setAttribute('tabindex', '0');
      card.setAttribute('role', 'link');

      const media = document.createElement('div');
      media.className = 'company-card-media';

      const imageUrl = String(company.card_image_url || '').trim();

      if (imageUrl) {
        const image = document.createElement('img');
        image.src = imageUrl;
        image.alt = 'تصویر ' + name;
        image.loading = 'lazy';
        image.addEventListener('error', () => {
          image.remove();
          media.classList.add('company-card-media-fallback');
        });
        media.appendChild(image);
      } else {
        media.classList.add('company-card-media-fallback');
      }

      const sectorBadge = document.createElement('span');
      sectorBadge.className = 'company-card-sector';
      sectorBadge.textContent = company.sector || 'حوزه فعالیت';
      media.appendChild(sectorBadge);

      const body = document.createElement('div');
      body.className = 'company-card-body';

      const heading = document.createElement('div');
      heading.className = 'company-card-heading';

      const title = document.createElement('h3');
      title.textContent = name;
      heading.appendChild(title);

      const description = document.createElement('p');
      description.className = 'company-card-description';
      description.textContent =
        company.short_description ||
        'برای آشنایی بیشتر با توانمندی‌های این مجموعه، پروفایل شرکت را مشاهده کنید.';

      const tagBox = document.createElement('div');
      tagBox.className = 'tags';

      String(company.tags || '')
        .replace(/،/g, ',')
        .split(',')
        .map(tag => tag.trim())
        .filter(Boolean)
        .slice(0, 3)
        .forEach(tag => {
          const tagElement = document.createElement('span');
          tagElement.className = 'tag';
          tagElement.textContent = tag;
          tagBox.appendChild(tagElement);
        });

      const profileLink = document.createElement('a');
      profileLink.className = 'card-link';
      profileLink.href = href;
      profileLink.textContent = 'مشاهده پروفایل ←';

      body.append(heading, description, tagBox, profileLink);
      card.append(media, body);

      card.addEventListener('click', event => {
        if (event.target.closest('a')) return;
        window.location.href = href;
      });

      card.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          window.location.href = href;
        }
      });

      return card;
    }

    function updateStats() {
      if (companyCount) {
        companyCount.textContent = companies.length.toLocaleString('fa-IR');
      }

      if (sectorCount) {
        const sectors = new Set(
          companies
            .map(company => String(company.sector || '').trim())
            .filter(Boolean)
        );
        sectorCount.textContent = sectors.size.toLocaleString('fa-IR');
      }
    }

    function render() {
      const term = searchInput
        ? searchInput.value.trim().toLocaleLowerCase('fa')
        : '';

      const shown = companies.filter(company => {
        const searchable = [
          company.name,
          company.sector,
          company.short_description,
          company.tags
        ]
          .map(value => String(value || ''))
          .join(' ')
          .toLocaleLowerCase('fa');

        const companySector = String(company.sector || '').toLocaleLowerCase('fa');
        const matchesSearch = searchable.includes(term);
        const matchesFilter =
          activeFilter === 'all' ||
          companySector.includes(activeFilter.toLocaleLowerCase('fa'));

        return matchesSearch && matchesFilter;
      });

      grid.querySelectorAll('.card').forEach(card => card.remove());
      shown.forEach(company => grid.insertBefore(createCard(company), emptyMessage));

      emptyMessage.style.display = shown.length ? 'none' : 'block';
      emptyMessage.textContent = companies.length
        ? 'شرکتی با این جست‌وجو یا حوزه پیدا نشد.'
        : 'هنوز شرکت تأیید و منتشرشده‌ای در شبکه آبان وجود ندارد.';

      networkStatus.textContent =
        shown.length.toLocaleString('fa-IR') + ' شرکت یا تیم نمایش داده می‌شود.';

      updateStats();
    }

    if (searchInput) {
      searchInput.addEventListener('input', render);
    }

    filters.forEach(button => {
      button.addEventListener('click', () => {
        filters.forEach(item => item.classList.remove('active'));
        button.classList.add('active');
        activeFilter = button.dataset.filter || 'all';
        render();
      });
    });

    async function fetchCompanies(fields) {
      const url =
        SUPABASE_URL.replace(/\/$/, '') +
        '/rest/v1/aban_companies?select=' + encodeURIComponent(fields) +
        '&is_published=eq.true&order=created_at.desc&limit=1000';

      const response = await fetch(url, {
        headers: { apikey: SUPABASE_PUBLISHABLE_KEY }
      });

      if (!response.ok) {
        throw new Error('خطای دریافت اطلاعات از شبکه آبان (' + response.status + ')');
      }

      const data = await response.json();
      if (!Array.isArray(data)) {
        throw new Error('پاسخ نامعتبر از سرور');
      }

      return data;
    }

    (async () => {
      const baseFields = 'slug,name,sector,short_description,tags';

      try {
        try {
          companies = await fetchCompanies(baseFields + ',card_image_url');
        } catch (imageFieldError) {
          // اگر ستون تصویر هنوز ساخته نشده باشد، صفحه بدون تصویر ولی سالم نمایش داده می‌شود.
          companies = await fetchCompanies(baseFields);
          companies = companies.map(company => ({
            ...company,
            card_image_url: ''
          }));
          console.info('card_image_url unavailable; company list loaded without images.');
        }

        companies = companies.filter(company => company.slug && company.name);
        render();
      } catch (error) {
        grid.querySelectorAll('.card').forEach(card => card.remove());
        emptyMessage.style.display = 'none';
        networkStatus.textContent =
          'امکان نمایش شبکه شرکت‌ها وجود ندارد. لطفاً دوباره تلاش کنید. (' +
          error.message +
          ')';
        console.warn('companies', error);
      }
    })();
  </script>
