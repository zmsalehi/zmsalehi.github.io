<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>شبکه شرکت‌ها و تیم‌های نوآور | آبان</title><style>:root{--navy:#022046;--cyan:#0799b8;--gold:#d1aa68;--bg:#f6fafc;--text:#09233f}*{box-sizing:border-box}body{font-family:Tahoma,Arial,sans-serif;margin:0;line-height:1.9;color:var(--text);background:var(--bg)}header{background:var(--navy);color:white;padding:20px 6%}header a{color:white;text-decoration:none}main{max-width:1120px;margin:auto;padding:38px 18px}h1{margin:0 0 12px}p{color:#62778b}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{background:white;border:1px solid #dce8ef;border-radius:18px;padding:22px;display:flex;flex-direction:column}.card h2{margin:0;font-size:20px}.card small{color:#0799b8}.card a{color:var(--navy);margin-top:auto;font-weight:bold;text-decoration:none}.tag{background:#edf7fb;border-radius:20px;padding:2px 9px;font-size:12px;display:inline-block;margin:2px}.search{font:inherit;padding:12px;border:1px solid #dce8ef;border-radius:12px;width:min(420px,100%);margin:15px 0 25px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><header><a href="index.html">آبان | بازگشت به صفحه اصلی</a></header><main><h1>شبکه شرکت‌ها و تیم‌های نوآور</h1><p>آشنایی با محصولات، توانمندی‌ها و راهکارهای تیم‌ها و شرکت‌های نوآور</p><input class="search" id="search" type="search" placeholder="نام، حوزه یا توانمندی را جست‌وجو کنید"><p id="msg" role="status">در حال دریافت فهرست...</p><div id="grid" class="grid"></div></main><script>
const SUPABASE_URL='https://yxmrflrqzpstmafkonnr.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_Fu7LRMCSJ85k7_FECupFhg_FQFqdaF8';
let entries=[];const grid=document.getElementById('grid'),msg=document.getElementById('msg');
function display(){grid.replaceChildren();const term=document.getElementById('search').value.trim().toLocaleLowerCase('fa');let matches=entries.filter(x=>(x.name+' '+x.sector+' '+x.short_description+' '+x.tags).toLocaleLowerCase('fa').includes(term));for(const x of matches){const el=document.createElement('article');el.className='card';const h=document.createElement('h2');h.textContent=x.name;const small=document.createElement('small');small.textContent=x.sector||'';const p=document.createElement('p');p.textContent=x.short_description||'';const tags=document.createElement('div');(x.tags||'').split('،').join(',').split(',').map(s=>s.trim()).filter(Boolean).slice(0,6).forEach(s=>{const span=document.createElement('span');span.className='tag';span.textContent=s;tags.append(span)});const a=document.createElement('a');a.href='company.html?slug='+encodeURIComponent(x.slug);a.textContent='مشاهده پروفایل ←';el.append(h,small,p,tags,a);grid.append(el)}msg.textContent=matches.length+' شرکت یا تیم نمایش داده می‌شود.'}
(async()=>{try{const r=await fetch(SUPABASE_URL.replace(/\/$/,'')+'/rest/v1/aban_companies?select=slug,name,sector,short_description,tags&is_published=eq.true&order=created_at.desc&limit=1000',{headers:{apikey:SUPABASE_PUBLISHABLE_KEY}});if(!r.ok)throw Error('خطای دریافت فهرست: '+r.status);entries=await r.json();display()}catch(e){msg.textContent=e.message}})();document.getElementById('search').oninput=display;
</script></body></html>
