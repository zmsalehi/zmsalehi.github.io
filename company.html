<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پروفایل شرکت | آبان</title><style>:root{--navy:#022046;--cyan:#0799b8;--gold:#d1aa68;--bg:#f6fafc;--text:#09233f}*{box-sizing:border-box}body{font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:2;margin:0}header{background:var(--navy);color:white;padding:18px 6%}header a{color:white;text-decoration:none}main{max-width:950px;margin:30px auto;padding:0 16px}.hero,.panel{background:white;padding:28px;border:1px solid #dce8ef;border-radius:16px;margin:16px 0}h1,h2{line-height:1.6}h1{margin:0}.sector{color:var(--cyan)}.content{white-space:pre-wrap;overflow-wrap:anywhere}.warn{color:#8f642d;font-size:14px}.btn{background:var(--navy);color:white;text-decoration:none;padding:10px 18px;border-radius:10px;display:inline-block}@media(max-width:600px){.hero,.panel{padding:18px}}</style></head><body><header><a href="companies-dynamic.html">← بازگشت به شبکه شرکت‌ها و تیم‌ها</a></header><main><div class="hero"><h1 id="name">در حال دریافت...</h1><p class="sector" id="sector"></p><p id="description"></p><p class="warn">پروفایل ارائه‌شده توسط آبان؛ اطلاعات را پیش از انتشار تأیید کنید.</p></div><div id="sections"></div><div class="panel"><h2>بررسی امکان همکاری</h2><p>برای طرح مسئله مرتبط با این شرکت، درخواست خود را برای بررسی توسط آبان ثبت کنید.</p><a class="btn" href="problem.html">ثبت مسئله</a></div></main><script>
const SUPABASE_URL='https://yxmrflrqzpstmafkonnr.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_Fu7LRMCSJ85k7_FECupFhg_FQFqdaF8';
const slug=new URLSearchParams(location.search).get('slug');
(async()=>{try{if(!slug||!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(slug))throw Error('شناسه شرکت نامعتبر است.');const url=SUPABASE_URL.replace(/\/$/,'')+'/rest/v1/aban_companies?select=name,sector,short_description,about,products,problems_solved,capabilities,cooperation&is_published=eq.true&slug=eq.'+encodeURIComponent(slug)+'&limit=1';const response=await fetch(url,{headers:{apikey:SUPABASE_PUBLISHABLE_KEY}});if(!response.ok)throw Error('خطای دریافت پروفایل');const data=await response.json();if(!data.length)throw Error('این پروفایل هنوز منتشر نشده یا وجود ندارد.');const x=data[0];document.title=x.name+' | آبان';document.getElementById('name').textContent=x.name;document.getElementById('sector').textContent=x.sector||'';document.getElementById('description').textContent=x.short_description||'';const parts=[['معرفی شرکت','about'],['محصولات و راهکارها','products'],['مسائل قابل حل','problems_solved'],['توانمندی‌های تخصصی','capabilities'],['زمینه‌های همکاری','cooperation']];for(const [label,key] of parts){if(!x[key])continue;const section=document.createElement('section');section.className='panel';const h=document.createElement('h2');h.textContent=label;const p=document.createElement('div');p.className='content';p.textContent=x[key];section.append(h,p);document.getElementById('sections').append(section)}}catch(e){document.getElementById('name').textContent=e.message}})();
</script></body></html>
